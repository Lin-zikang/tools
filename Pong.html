<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <link
    rel="icon"
    href="https://user-assets.sxlcdn.com/images/1209238/FjS1xyj_nwI3FhZiqn6aoZi1o082.png?imageMogr2/strip/auto-orient/thumbnail/!200x200r/gravity/Center/crop/200x200/quality/90!/format/png"
    type="image/png"
  />
  <title>Pong</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b13;
      --bg-soft: #0e1727;
      --panel: rgba(17, 25, 39, .88);
      --panel-strong: #111a2a;
      --panel-2: #1a2740;
      --text: #f5f8ff;
      --muted: #9eacc4;
      --accent: #4ea7ff;
      --accent-strong: #257ee8;
      --danger: #ff5d6c;
      --border: rgba(255, 255, 255, .11);
      --border-strong: rgba(108, 178, 255, .34);
      --ok: #7ee787;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 13px;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(63, 141, 255, .24), transparent 32%),
        radial-gradient(circle at 88% 16%, rgba(79, 78, 255, .14), transparent 28%),
        linear-gradient(145deg, #0b1220 0%, var(--bg) 56%, #05070c 100%);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    button,
    #project {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    main {
      width: min(1080px, 100%);
      display: grid;
      gap: clamp(12px, 1.8vw, 18px);
    }

    .header {
      min-width: 0;
      padding: 2px clamp(2px, 1vw, 8px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .title-block {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 3vw, 40px);
      line-height: 1;
      letter-spacing: -.025em;
      text-shadow: 0 6px 30px rgba(78, 167, 255, .22);
    }

    .copyright,
    .badge {
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      line-height: 1.25;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .copyright {
      padding: 7px 11px;
      background: rgba(78, 167, 255, .12);
      border-color: rgba(78, 167, 255, .32);
      color: #dcecff;
      font-size: 13px;
      font-weight: 700;
    }

    .badge {
      padding: 7px 11px;
      background: rgba(255, 255, 255, .055);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .intro-panel {
      min-width: 0;
      padding: clamp(14px, 2vw, 20px) clamp(16px, 2.4vw, 24px);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(110deg, rgba(78, 167, 255, .12), transparent 42%),
        rgba(13, 21, 35, .78);
      box-shadow: 0 16px 46px rgba(0, 0, 0, .22);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(13px, 2vw, 18px);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .intro-mark {
      width: clamp(42px, 5vw, 54px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid rgba(116, 191, 255, .42);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(91, 181, 255, .24), rgba(37, 126, 232, .08));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 10px 26px rgba(21, 91, 170, .17);
    }

    .intro-mark::before {
      content: "";
      width: 19%;
      height: 72%;
      border-radius: 999px;
      background: linear-gradient(180deg, #dff2ff, #63b8ff);
      box-shadow: 0 0 16px rgba(78, 167, 255, .55);
      transform: rotate(18deg);
    }

    .intro-mark::after {
      content: "";
      width: 27%;
      aspect-ratio: 1;
      position: absolute;
      right: 17%;
      top: 17%;
      border-radius: 50%;
      background: #f7fbff;
      box-shadow: 0 0 14px rgba(255, 255, 255, .56);
    }

    .intro-content { min-width: 0; }

    .intro-heading {
      margin: 0 0 6px;
      color: #eaf5ff;
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.3;
      letter-spacing: .04em;
    }

    .intro-text {
      margin: 0;
      color: #b9c8dc;
      font-size: clamp(12px, 1.35vw, 14px);
      line-height: 1.75;
      text-wrap: pretty;
    }

    .card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .022));
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #project-shell {
      padding: clamp(9px, 1.6vw, 16px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .025), transparent 16%),
        #080c13;
      display: grid;
      place-items: center;
    }

    #project {
      width: min(100%, calc((100dvh - 235px) * 4 / 3));
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, .095);
      border-radius: var(--radius-lg);
      box-shadow: 0 14px 42px rgba(0, 0, 0, .48), inset 0 0 0 1px rgba(255, 255, 255, .025);
      outline: none;
    }

    #project:focus-visible {
      border-color: rgba(92, 174, 255, .78);
      box-shadow: 0 0 0 3px rgba(78, 167, 255, .18), 0 14px 42px rgba(0, 0, 0, .48);
    }

    .toolbar {
      min-width: 0;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .buttons {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar button {
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .025)), var(--panel-2);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .15);
      transition: transform .14s ease, filter .14s ease, border-color .14s ease, box-shadow .14s ease;
    }

    .toolbar button.primary {
      background: linear-gradient(180deg, #61b8ff, var(--accent-strong));
      border-color: rgba(142, 207, 255, .74);
      box-shadow: 0 9px 24px rgba(37, 126, 232, .28);
    }

    .toolbar button.danger {
      background: linear-gradient(180deg, #ff7481, #d73c50);
      border-color: rgba(255, 140, 150, .7);
      box-shadow: 0 9px 24px rgba(215, 60, 80, .2);
    }

    #status {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: right;
    }

    #status::before {
      content: "";
      width: 7px;
      height: 7px;
      margin-right: 7px;
      display: inline-block;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
      vertical-align: .08em;
      opacity: .75;
    }

    #status.ready { color: var(--ok); }
    #status.error { color: #ff9aa5; white-space: pre-wrap; }

    .touch-controls {
      display: none;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(13, 20, 33, .96), rgba(8, 13, 22, .98));
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .control-group {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, .035);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 9px;
    }

    .control-label {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-align: center;
    }

    .touch-key {
      min-width: 0;
      min-height: 58px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-bottom-color: rgba(255, 255, 255, .28);
      border-radius: 14px;
      background: linear-gradient(180deg, #253653, #162238);
      color: var(--text);
      font-size: 24px;
      font-weight: 850;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 7px 0 #0a111d, 0 12px 24px rgba(0, 0, 0, .28);
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease, filter .08s ease;
    }

    .touch-key.is-pressed {
      transform: translateY(5px) scale(.985);
      border-color: rgba(102, 184, 255, .72);
      background: linear-gradient(180deg, #347bc5, #1f5795);
      box-shadow: 0 2px 0 #0a111d, 0 5px 13px rgba(0, 0, 0, .3);
      filter: brightness(1.08);
    }

    .notice {
      margin: 0;
      padding: 0 clamp(3px, 1vw, 8px);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .keys {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
      vertical-align: middle;
    }

    kbd {
      min-width: 1.9em;
      padding: 2px 6px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, .2);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .075);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .95em;
      line-height: 1.35;
      text-align: center;
    }

    @media (hover: hover) and (pointer: fine) {
      .toolbar button:hover {
        transform: translateY(-2px);
        filter: brightness(1.06);
        border-color: rgba(255, 255, 255, .3);
        box-shadow: 0 11px 26px rgba(0, 0, 0, .24);
      }
    }

    .toolbar button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
    }

    @media (max-width: 900px), (pointer: coarse) {
      body {
        place-items: start center;
      }

      #project {
        width: 100%;
      }

      .touch-controls {
        display: grid;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      main { width: min(900px, 100%); }
      .card { border-radius: 22px; }
    }

    @media (max-width: 640px) {
      body {
        padding:
          max(10px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }

      main { gap: 10px; }

      .header {
        align-items: center;
        padding: 1px 2px;
      }

      .title-block { gap: 8px; }
      h1 { font-size: 26px; }
      .copyright { font-size: 11px; padding: 6px 9px; }
      .badge { font-size: 10px; padding: 6px 8px; }

      .intro-panel {
        padding: 12px 13px;
        border-radius: 15px;
        gap: 11px;
      }

      .intro-mark {
        width: 40px;
        border-radius: 12px;
      }

      .intro-heading { margin-bottom: 4px; font-size: 14px; }
      .intro-text { font-size: 11px; line-height: 1.62; }

      .card { border-radius: 18px; }
      #project-shell { padding: 7px; }
      #project { border-radius: 13px; }

      .toolbar {
        padding: 9px;
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
      }

      .buttons {
        width: 100%;
        display: grid;
        grid-template-columns: 1.28fr .9fr .9fr;
        gap: 7px;
      }

      .toolbar button {
        min-width: 0;
        min-height: 40px;
        padding: 8px 7px;
        border-radius: 10px;
        font-size: 12px;
      }

      #status {
        width: 100%;
        min-height: 18px;
        padding: 0 2px;
        font-size: 11px;
        text-align: left;
      }

      .touch-controls {
        padding: 9px;
        gap: 8px;
      }

      .control-group {
        padding: 8px;
        border-radius: 13px;
        gap: 7px;
      }

      .control-label { font-size: 10px; }

      .touch-key {
        min-height: clamp(52px, 15vw, 64px);
        border-radius: 12px;
        font-size: clamp(20px, 7vw, 28px);
        box-shadow: 0 5px 0 #0a111d, 0 9px 18px rgba(0, 0, 0, .27);
      }

      .touch-key.is-pressed {
        transform: translateY(4px) scale(.985);
        box-shadow: 0 1px 0 #0a111d, 0 4px 10px rgba(0, 0, 0, .28);
      }

      .notice {
        padding-inline: 3px;
        font-size: 11px;
        line-height: 1.55;
      }
    }

    @media (max-width: 380px) {
      .copyright { display: none; }
      .touch-controls { grid-template-columns: 1fr; }
      .control-group { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (orientation: landscape) and (max-height: 560px) and (pointer: coarse) {
      body { padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom)); }
      main { width: min(980px, 100%); gap: 7px; }
      .header, .intro-panel, .notice { display: none; }
      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(210px, 32vw);
        grid-template-rows: auto auto;
      }
      #project-shell { grid-row: 1 / 3; padding: 7px; }
      #project { width: min(100%, calc((100dvh - 30px) * 4 / 3)); }
      .toolbar {
        grid-column: 2;
        padding: 8px;
      }
      .buttons { grid-template-columns: 1fr; }
      #status { display: none; }
      .touch-controls {
        grid-column: 2;
        padding: 8px;
        grid-template-columns: 1fr;
        align-content: center;
      }
      .touch-key { min-height: 44px; font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <div class="title-block">
        <h1>Pong</h1>
        <p class="copyright">© Wang.Ziling 版权所有。</p>
      </div>
      <span class="badge">Scratch HTML</span>
    </header>

    <section class="intro-panel" aria-labelledby="game-intro-title">
      <div class="intro-mark" aria-hidden="true"></div>
      <div class="intro-content">
        <h2 class="intro-heading" id="game-intro-title">游戏介绍</h2>
        <p class="intro-text">这是一个简易的打乒乓球游戏，左侧使用ws控制，右侧用↑↓控制移动，率先取得10分的玩家赢得胜利。打开右上角菜单可选择与AI对战，有三种难度，点击空白处关闭菜单。</p>
      </div>
    </section>

    <section class="card" aria-label="Scratch 项目播放器">
      <div id="project-shell">
        <div id="project" tabindex="0" aria-label="Scratch 舞台，请点击后使用键盘操作"></div>
      </div>

      <div class="toolbar">
        <div class="buttons">
          <button id="greenFlag" class="primary" type="button">开始 / 绿旗</button>
          <button id="stopAll" class="danger" type="button">停止</button>
          <button id="fullScreen" type="button">全屏</button>
        </div>
        <div id="status" role="status" aria-live="polite">正在准备运行时……</div>
      </div>

      <div class="touch-controls" aria-label="手机触控键盘">
        <div class="control-group" aria-label="左侧球拍控制">
          <span class="control-label">左侧球拍</span>
          <button class="touch-key" type="button" data-virtual-key="w" aria-label="W，上移" aria-pressed="false">W</button>
          <button class="touch-key" type="button" data-virtual-key="s" aria-label="S，下移" aria-pressed="false">S</button>
        </div>
        <div class="control-group" aria-label="右侧球拍控制">
          <span class="control-label">右侧球拍</span>
          <button class="touch-key" type="button" data-virtual-key="ArrowUp" aria-label="方向键上，上移" aria-pressed="false">↑</button>
          <button class="touch-key" type="button" data-virtual-key="ArrowDown" aria-label="方向键下，下移" aria-pressed="false">↓</button>
        </div>
      </div>
    </section>

    <p class="notice">
      控制说明：左侧球拍使用 <span class="keys"><kbd>W</kbd><kbd>S</kbd></span>，右侧球拍使用 <span class="keys"><kbd>↑</kbd><kbd>↓</kbd></span>。打开后点击“开始 / 绿旗”，再点击一次游戏画面即可稳定接收键盘输入。
    </p>
  </main>

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = type || '';
    }

    function base64ToUint8Array(base64) {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('运行时加载失败：' + url));
        document.head.appendChild(script);
      });
    }

    async function ensureRuntime() {
      if (window.Scaffolding) return;
      let lastError;
      for (const url of RUNTIME_URLS) {
        try {
          setStatus('正在联网加载 Scratch/TurboWarp 运行时……');
          await loadScript(url);
          if (window.Scaffolding) return;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('Scratch/TurboWarp 运行时没有加载成功。请确认网络可访问 jsDelivr 或 unpkg 后刷新页面。');
    }

    function focusStage() {
      try { projectEl.focus({ preventScroll: true }); } catch (_) { projectEl.focus(); }
    }

    function normalizeKey(eventKey) {
      if (!eventKey) return '';
      if (eventKey.length === 1) return eventKey.toLowerCase();
      if (eventKey === 'Up') return 'ArrowUp';
      if (eventKey === 'Down') return 'ArrowDown';
      if (eventKey === 'Left') return 'ArrowLeft';
      if (eventKey === 'Right') return 'ArrowRight';
      return eventKey;
    }

    function isGameKey(key) {
      return key === 'w' || key === 'a' || key === 's' || key === 'd' ||
             key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight' ||
             key === ' ' || key === 'Enter';
    }

    function sendKeyState(key, isDown, keyCode = 0) {
      if (!loaded || !scaffolding || !scaffolding.vm) return;
      scaffolding.vm.postIOData('keyboard', { key, keyCode, isDown });
    }

    function forwardKeyEvent(e, isDown) {
      const key = normalizeKey(e.key);
      if (!key) return;

      // Scratch VM keyboard input now relies on `key` rather than only keyCode.
      // Sending both makes the wrapper more compatible with older/newer VM builds.
      sendKeyState(key, isDown, e.keyCode || e.which || 0);

      if (loaded && isGameKey(key)) e.preventDefault();
    }

    function releaseAllKeys() {
      ['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].forEach(key => {
        sendKeyState(key, false);
      });
      touchKeyButtons.forEach(button => {
        button.classList.remove('is-pressed');
        button.setAttribute('aria-pressed', 'false');
      });
    }

    async function init() {
      try {
        await ensureRuntime();
        scaffolding = new Scaffolding.Scaffolding();
        scaffolding.width = 480;
        scaffolding.height = 360;
        scaffolding.resizeMode = 'preserve-ratio';
        scaffolding.editableLists = false;
        scaffolding.shouldConnectPeripherals = true;
        scaffolding.setup();
        scaffolding.appendTo(projectEl);

        if (scaffolding.vm && scaffolding.vm.setFramerate) scaffolding.vm.setFramerate(30);
        if (scaffolding.vm && scaffolding.vm.setTurboMode) scaffolding.vm.setTurboMode(false);

        setStatus('正在解析嵌入的 .sb3 数据……');
        await scaffolding.loadProject(base64ToUint8Array(SB3_BASE64));
        loaded = true;
        setStatus('项目已加载。点击“开始 / 绿旗”后使用 W/S 或 ↑/↓ 操作。', 'ready');
        focusStage();
      } catch (err) {
        console.error(err);
        setStatus((err && err.message ? err.message : String(err)), 'error');
      }
    }

    greenFlagBtn.addEventListener('click', () => {
      if (!loaded || !scaffolding) return;
      focusStage();
      scaffolding.greenFlag();
      started = true;
      setStatus('运行中：左侧 W/S，右侧 ↑/↓。', 'ready');
    });

    stopAllBtn.addEventListener('click', () => {
      if (!loaded || !scaffolding) return;
      scaffolding.stopAll();
      started = false;
      setStatus('已停止。', '');
      // Release any keys that may be stuck if the window lost focus.
      releaseAllKeys();
    });

    fullScreenBtn.addEventListener('click', async () => {
      try {
        focusStage();
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.querySelector('.card').requestFullscreen();
      } catch (err) {
        setStatus('当前浏览器不允许进入全屏。', 'error');
      }
    });

    projectEl.addEventListener('pointerdown', focusStage, true);
    projectEl.addEventListener('touchstart', focusStage, { passive: true, capture: true });

    window.addEventListener('keydown', e => forwardKeyEvent(e, true), true);
    window.addEventListener('keyup', e => forwardKeyEvent(e, false), true);
    const activeTouchPointers = new Map();

    function pressVirtualKey(button, event) {
      if (!loaded) return;
      event.preventDefault();
      focusStage();

      const key = button.dataset.virtualKey;
      activeTouchPointers.set(event.pointerId, { button, key });
      button.classList.add('is-pressed');
      button.setAttribute('aria-pressed', 'true');
      sendKeyState(key, true);

      try { button.setPointerCapture(event.pointerId); } catch (_) {}
    }

    function releaseVirtualKey(event) {
      const active = activeTouchPointers.get(event.pointerId);
      if (!active) return;

      event.preventDefault();
      sendKeyState(active.key, false);
      active.button.classList.remove('is-pressed');
      active.button.setAttribute('aria-pressed', 'false');
      activeTouchPointers.delete(event.pointerId);
    }

    touchKeyButtons.forEach(button => {
      button.addEventListener('pointerdown', event => pressVirtualKey(button, event));
      button.addEventListener('pointerup', releaseVirtualKey);
      button.addEventListener('pointercancel', releaseVirtualKey);
      button.addEventListener('lostpointercapture', releaseVirtualKey);
      button.addEventListener('contextmenu', event => event.preventDefault());
    });

    window.addEventListener('blur', releaseAllKeys);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) releaseAllKeys();
    });

    window.addEventListener('resize', () => {
      if (scaffolding && scaffolding.relayout) scaffolding.relayout();
    });

    init();
  </script>
</body>
</html>
