<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="icon"
    href="https://user-assets.sxlcdn.com/images/1209238/FlWuslNmGTHt1EipxUtq2GI6zqnN.png?imageMogr2/strip/auto-orient/thumbnail/1200x9000%3E/quality/90!/format/png"
    type="image/png"
  />
  <title>友情链接 - 工具大全</title>
  <style>
    /* ============ 主题变量（与主页保持一致） ============ */
    :root {
      --bg: #f2f5f9;
      --surface: #ffffff;
      --border: #e1e8f0;
      --text: #2b3a4a;
      --muted: #7c8b9a;
      --accent: #3498db;
      --accent-strong: #2980b9;
      --link: #2980b9;
      --btn-text: #ffffff;
      --shadow: 0 2px 10px rgba(31, 45, 61, .07);
      --shadow-lg: 0 12px 26px rgba(31, 45, 61, .14);
      --ring: rgba(52, 152, 219, .30);
      --radius: 14px;
      --pad: 20px;
    }

    html.dark-mode {
      --bg: #22303e;
      --surface: #2f4152;
      --border: #3d5468;
      --text: #e9eef3;
      --muted: #a9b8c4;
      --accent: #1abc9c;
      --accent-strong: #16a085;
      --link: #35d3b4;
      --btn-text: #0e2a25;
      --shadow: 0 2px 10px rgba(0, 0, 0, .30);
      --shadow-lg: 0 12px 26px rgba(0, 0, 0, .42);
      --ring: rgba(26, 188, 156, .30);
    }

    /* ============ 基础 ============ */
    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
    }

    /* ============ 顶部控制区 ============ */
    .top-controls {
      width: 100%;
      max-width: 1100px;
      padding: 16px var(--pad) 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      font-size: .9rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      transition: color .2s ease, border-color .2s ease,
                  transform .2s ease, background-color .3s ease;
    }

    .back-link:hover {
      color: var(--link);
      border-color: var(--accent);
      transform: translateX(-3px);
    }

    .back-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #dark-mode-toggle {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 700;
      color: #fff;
      background: #2c3e50;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .18);
      transition: transform .2s ease, background-color .3s ease, color .3s ease;
    }

    #dark-mode-toggle:hover { transform: scale(1.08); }

    #dark-mode-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #dark-mode-toggle.switching { animation: bounce .5s ease-in-out; }

    @keyframes bounce {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    html.dark-mode #dark-mode-toggle {
      background: #e9eef3;
      color: #2c3e50;
    }

    /* ============ 页面标题 ============ */
    .page-head {
      width: 100%;
      max-width: 1100px;
      padding: 28px var(--pad) 0;
      text-align: center;
    }

    .page-head h1 {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2.05rem);
      letter-spacing: .5px;
      line-height: 1.3;
    }

    .page-head h1::after {
      content: "";
      display: block;
      width: 56px;
      height: 4px;
      margin: 14px auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    }

    .page-head p {
      margin: 14px auto 0;
      max-width: 460px;
      font-size: clamp(.9rem, 2.5vw, 1rem);
      line-height: 1.65;
      color: var(--muted);
      transition: color .3s ease;
    }

    /* ============ 友链列表（居中） ============ */
    #links-grid {
      width: 100%;
      max-width: 1100px;
      margin: 28px auto 0;
      padding: 0 var(--pad);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: start;
      gap: 12px;
    }

    .link-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      transition: transform .22s ease, box-shadow .22s ease,
                  border-color .22s ease, background-color .3s ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
      outline: none;
    }

    .link-card:focus-visible {
      box-shadow: var(--shadow-lg), 0 0 0 3px var(--ring);
    }

    /* Logo 容器 */
    .link-logo {
      position: relative;
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--muted);
      user-select: none;
      transition: background-color .3s ease, border-color .3s ease;
    }

    .link-logo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 6px;
      object-fit: contain;
      background: var(--surface);
      transition: background-color .3s ease;
    }

    /* 文本区 */
    .link-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .link-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .2s ease;
    }

    .link-desc {
      font-size: .84rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .2s ease;
    }

    .link-arrow {
      flex: 0 0 auto;
      font-size: 1rem;
      line-height: 1;
      color: var(--muted);
      opacity: .65;
      transition: transform .22s ease, color .22s ease, opacity .22s ease;
    }

    .link-card:hover .link-name,
    .link-card:focus-visible .link-name { color: var(--link); }

    .link-card:hover .link-arrow,
    .link-card:focus-visible .link-arrow {
      color: var(--accent);
      opacity: 1;
      transform: translate(2px, -2px);
    }

    /* ============ 交换友链提示 ============ */
    .exchange {
      width: 100%;
      max-width: 1100px;
      margin: 30px auto 0;
      padding: 0 var(--pad) 44px;
      text-align: center;
      font-size: .9rem;
      line-height: 1.7;
      color: var(--muted);
      transition: color .3s ease;
    }

    .exchange a {
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dashed currentColor;
      transition: color .2s ease;
    }

    .exchange a:hover { color: var(--accent-strong); }

    /* ============ 页脚 ============ */
    footer {
      margin-top: auto;
      width: 100%;
      background: #34495e;
      color: #fff;
      text-align: center;
      padding: 26px var(--pad);
      transition: background-color .3s ease;
    }

    footer p {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .5px;
    }

    footer p span { color: #ffeb3b; }

    footer a {
      display: inline-block;
      padding: 5px 10px;
      font-size: .92rem;
      font-weight: 600;
      color: #ffeb3b;
      text-decoration: none;
      border-radius: 8px;
      transition: color .25s ease, background-color .25s ease;
    }

    footer a:hover {
      color: #fff;
      background: rgba(255, 255, 255, .12);
    }

    html.dark-mode footer { background: #1a252f; }

    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .footer-divider {
      color: rgba(255, 255, 255, .35);
      font-weight: 400;
      user-select: none;
    }

    html.dark-mode .footer-divider { color: rgba(255, 255, 255, .25); }

    /* ============ 响应式 ============ */
    @media (max-width: 600px) {
      :root { --pad: 14px; }

      .top-controls { padding-top: 12px; }
      #dark-mode-toggle { width: 34px; height: 34px; font-size: .84rem; }
      .back-link { padding: 8px 13px; font-size: .86rem; }
      .page-head { padding-top: 22px; }
      #links-grid { margin-top: 22px; gap: 10px; }
      .link-card { padding: 14px; gap: 12px; }
      .link-logo { width: 46px; height: 46px; font-size: 1rem; }
      .link-name { font-size: .96rem; }
      .link-desc { font-size: .8rem; }
      .exchange { margin-top: 24px; padding-bottom: 36px; }
      footer { padding: 22px var(--pad); }
    }

    /* 平板：一行 2 个 */
    @media (min-width: 640px) {
      #links-grid { gap: 14px; }
      .link-card {
        width: calc((100% - 14px) / 2);
      }
    }

    /* 电脑：一行 3 个 */
    @media (min-width: 1024px) {
      #links-grid { gap: 16px; }
      .link-card {
        width: calc((100% - 32px) / 3);
      }
    }

    /* 减少动效偏好 */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>

  <!-- 提前应用暗色模式，避免闪烁：首次按系统，之后按 localStorage -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('darkMode');
        var isDark;
        if (stored === null) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          localStorage.setItem('darkMode', isDark);
        } else {
          isDark = stored === 'true';
        }
        if (isDark) {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {
        /* 隐私模式等异常：默认亮色 */
      }
    })();
  </script>
</head>
<body>
  <div class="top-controls">
    <a class="back-link" href="/">← 返回首页</a>
    <button id="dark-mode-toggle" aria-label="切换日间/夜间模式">夜</button>
  </div>

  <header class="page-head">
    <h1>友情链接</h1>
    <p>一路同行的伙伴小站，欢迎常去看看 👀</p>
  </header>

  <!-- 友链卡片由下方 FRIEND_LINKS 数据自动生成 -->
  <main id="links-grid" aria-label="友情链接列表"></main>

  <div class="exchange">
    想交换友链？欢迎邮件联系
    <a href="mailto:united-grade2@qq.com">united-grade2@qq.com</a>
  </div>

  <footer>
    <p>© <span>Lin.ZiKang</span> 版权所有 2024-2026</p>
    <div class="footer-links">
      <a href="/">返回首页</a>
      <span class="footer-divider">·</span>
      <a href="mailto:united-grade2@qq.com">联系邮箱：united-grade2@qq.com</a>
    </div>
  </footer>

  <script>
    /* ========================================================
       友情链接数据
       —— 以后新增友链，只需在数组里追加一个对象即可：
       {
         name: '站点名称',
         desc: '一句话备注',
         url:  'https://站点地址/',
         logo: 'https://logo图片地址'   // 可留空 ''，会自动显示首字母占位
       }
       ======================================================== */
    const FRIEND_LINKS = [
      {
        name: 'ZDZL',
        desc: '不止于想象',
        url: 'https://www.zdzltop.com/',
        logo: 'https://www.zdzltop.com/zdzl-favicon.jpg'
      },
      {
        name: '日历午后',
        desc: '本地的检索助手工具',
        url: 'https://riliwuhou.de5.net/',
        logo: 'https://riliwuhou.de5.net/assets/logo.png'
      },
      {
        name: '大师主宰级团队',
        desc: '以技术为刃，以协同为核。',
        url: 'https://elite-unit.meoo.info/',
        logo: 'https://conversation.cdn.meoo.host/conversations/363666283130253312/image/2026-10-01/1790843717640-72b4ae815c7c41f788934b6992af3442.jpg?auth_key=cdd71ce0c2fe0bc31cef91b4375e8c97b31a8835be713cb90310e2b5964736b6'
      }
    ];

    /* ---------- 工具函数 ---------- */
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[c];
      });
    }

    /* ---------- 渲染友链卡片 ---------- */
    function renderFriendLinks() {
      const grid = document.getElementById('links-grid');

      grid.innerHTML = FRIEND_LINKS.map(function (item) {
        const name = escapeHtml(item.name);
        const desc = escapeHtml(item.desc || '');
        const url = escapeHtml(item.url);
        const fallback = escapeHtml((item.name || '?').trim().charAt(0).toUpperCase());
        const img = item.logo
          ? '<img src="' + escapeHtml(item.logo) + '" alt="' + name +
            ' Logo" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">'
          : '';

        return (
          '<a class="link-card" href="' + url + '" target="_blank" rel="noopener noreferrer" title="' + name + '">' +
            '<span class="link-logo">' +
              '<span class="logo-fallback">' + fallback + '</span>' +
              img +
            '</span>' +
            '<span class="link-body">' +
              '<span class="link-name">' + name + '</span>' +
              '<span class="link-desc">' + desc + '</span>' +
            '</span>' +
            '<span class="link-arrow" aria-hidden="true">↗</span>' +
          '</a>'
        );
      }).join('');
    }

    /* ---------- 暗色模式 ---------- */
    const dmBtn = document.getElementById('dark-mode-toggle');
    let isDark = document.documentElement.classList.contains('dark-mode');
    dmBtn.innerText = isDark ? '日' : '夜';

    dmBtn.addEventListener('click', function () {
      dmBtn.classList.add('switching');
      setTimeout(function () { dmBtn.classList.remove('switching'); }, 500);

      document.documentElement.classList.toggle('dark-mode');
      const nowDark = document.documentElement.classList.contains('dark-mode');
      dmBtn.innerText = nowDark ? '日' : '夜';
      try { localStorage.setItem('darkMode', nowDark); } catch (e) {}
    });

    /* ---------- 初始化 ---------- */
    renderFriendLinks();
  </script>
</body>
</html>
