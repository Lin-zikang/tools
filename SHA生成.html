<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>SHA生成器</title>
  <link
    rel="icon"
    href="https://user-assets.sxlcdn.com/images/1209238/FlWuslNmGTHt1EipxUtq2GI6zqnN.png?imageMogr2/strip/auto-orient/thumbnail/1200x9000%3E/quality/90!/format/png"
    type="image/png"
  />
  <style>
    :root{
      color-scheme:light;
      --bg:#f5f7fb;--surface:#ffffff;--surface-soft:#f8fafc;--text:#172033;--muted:#6b7280;
      --line:#e5eaf1;--line-strong:#d9e0ea;--primary:#2563eb;--primary-hover:#1d4ed8;--primary-soft:#eff6ff;
      --success:#08775f;--success-bg:#ecfdf5;--warn:#9a6700;--warn-bg:#fff8e6;--danger:#b42318;
      --shadow:0 14px 40px rgba(23,32,51,.07);--radius:20px;
    }
    *{box-sizing:border-box}
    html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fbfcfe 0,#f5f7fb 48%,#f2f5f9 100%)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.dropzone:focus-visible{outline:3px solid rgba(37,99,235,.16);outline-offset:2px}
    .wrap{width:min(1160px,calc(100% - 40px));margin:auto;padding:36px 0 40px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .logo{flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--primary);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.22)}
    .logo svg{width:23px;height:23px}
    h1{margin:0;font-size:clamp(25px,3vw,34px);line-height:1.05;letter-spacing:-.035em}
    .subtitle{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .privacy{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #cdeee4;border-radius:999px;background:var(--success-bg);color:var(--success);font-size:12px;font-weight:750;white-space:nowrap}
    .privacy::before{content:"";width:7px;height:7px;border-radius:50%;background:#10b981}
    .layout{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(330px,.82fr);gap:18px;align-items:start}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .panel{padding:22px}
    .controls{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px;margin-bottom:15px}
    label.caption{display:block;margin:0 0 7px;color:#4b5563;font-size:12px;font-weight:750}
    select,input[type="number"]{width:100%;height:46px;border:1px solid var(--line-strong);border-radius:12px;background:#fff;color:var(--text);padding:0 13px;outline:0}
    select:hover,input[type="number"]:hover{border-color:#c9d2df}
    .tabs{display:flex;gap:4px;width:max-content;max-width:100%;padding:4px;margin-bottom:14px;border-radius:12px;background:#eef2f7}
    .tab{min-width:92px;border:0;border-radius:9px;background:transparent;color:#64748b;padding:9px 14px;font-size:13px;font-weight:800}
    .tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(23,32,51,.10)}
    textarea.input{display:block;width:100%;min-height:300px;resize:vertical;border:1px solid var(--line-strong);border-radius:14px;background:#fff;color:var(--text);padding:15px 16px;outline:0;line-height:1.65;font-size:14px}
    textarea.input::placeholder,.result::placeholder{color:#9aa4b2}
    .input-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 0;color:#8a94a3;font-size:11px}
    .dropzone{min-height:300px;display:grid;place-items:center;padding:28px;border:1.5px dashed #cbd5e1;border-radius:14px;background:var(--surface-soft);text-align:center;transition:border-color .16s ease,background .16s ease}
    .dropzone:hover,.dropzone.drag{border-color:#7aa7f7;background:#f4f8ff}
    .drop-inner{max-width:420px}
    .upload-icon{width:50px;height:50px;margin:0 auto 13px;display:grid;place-items:center;border-radius:14px;background:var(--primary-soft);color:var(--primary)}
    .upload-icon svg{width:24px;height:24px}
    .dropzone strong{display:block;font-size:15px;margin-bottom:6px}
    .dropzone p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
    .choose{margin-top:14px;border:1px solid #c7d8fb;border-radius:10px;background:#fff;color:var(--primary);padding:9px 13px;font-size:12px;font-weight:800}
    .file-info{display:none;margin-top:14px;padding:10px 12px;border:1px solid #dbe6f5;border-radius:10px;background:#fff;text-align:left}
    .file-info.show{display:block}
    .file-name{font-size:12px;font-weight:800;overflow-wrap:anywhere}
    .file-size{margin-top:3px;color:var(--muted);font-size:11px}
    .actionbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}
    .case-toggle{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;user-select:none}
    .case-toggle input{width:16px;height:16px;accent-color:var(--primary)}
    .actions{display:flex;gap:8px}
    .btn{min-height:42px;border:1px solid var(--line-strong);border-radius:11px;background:#fff;color:#475569;padding:10px 14px;font-size:13px;font-weight:800}
    .btn:hover{background:#f8fafc}
    .btn.primary{min-width:122px;border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 7px 18px rgba(37,99,235,.17)}
    .btn.primary:hover{background:var(--primary-hover)}
    .btn.danger{color:var(--danger)}
    .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
    .progress-wrap{display:none;margin-top:15px}
    .progress-wrap.show{display:block}
    .progress-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;color:var(--muted);font-size:11px}
    .progress{height:7px;overflow:hidden;border-radius:999px;background:#e9eef5}
    .progress i{display:block;width:0;height:100%;border-radius:inherit;background:var(--primary);transition:width .14s linear}
    .status{min-height:19px;margin-top:10px;color:#7b8797;font-size:11px;line-height:1.55}
    .status.ok{color:var(--success)}.status.err{color:var(--danger)}.status.warn{color:var(--warn)}
    .result-card{position:sticky;top:18px}
    .result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
    .result-head h2{margin:0;font-size:15px;letter-spacing:-.01em}
    .copy{border:1px solid var(--line-strong);border-radius:9px;background:#fff;color:#526173;padding:7px 10px;font-size:11px;font-weight:800}
    .copy:not(:disabled):hover{background:#f8fafc;color:var(--primary)}
    .copy:disabled{opacity:.45;cursor:not-allowed}
    .result{display:block;width:100%;min-height:184px;resize:vertical;border:1px solid var(--line-strong);border-radius:13px;background:#f8fafc;color:#12305f;padding:14px;outline:0;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12px;line-height:1.65;word-break:break-all}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
    .metric{min-width:0;padding:9px 10px;border-radius:10px;background:#f8fafc}
    .metric b{display:block;margin-bottom:3px;color:#8a94a3;font-size:10px;font-weight:750}
    .metric span{display:block;overflow:hidden;text-overflow:ellipsis;color:#475569;font-size:11px;font-weight:800;white-space:nowrap}
    .hint{margin-top:12px;padding:10px 11px;border-radius:10px;background:#f8fafc;color:#697586;font-size:11px;line-height:1.55}
    .hint.warn{background:var(--warn-bg);color:var(--warn)}
    .footnote{margin:17px 2px 0;color:#8a94a3;font-size:11px;line-height:1.65;text-align:center}
    [hidden]{display:none!important}
    @media (max-width:940px){
      .wrap{width:min(820px,calc(100% - 28px));padding-top:28px}.layout{grid-template-columns:1fr}.result-card{position:static}.result{min-height:150px}.controls{grid-template-columns:minmax(0,1fr) 170px}
    }
    @media (max-width:640px){
      .wrap{width:calc(100% - 20px);padding:18px 0 26px}.topbar{align-items:flex-start}.logo{width:40px;height:40px;border-radius:12px}.subtitle{font-size:12px}.privacy{display:none}.panel{padding:15px}.controls{grid-template-columns:1fr;gap:10px}.tabs{width:100%}.tab{flex:1;min-width:0}.dropzone,textarea.input{min-height:225px}.actionbar{display:grid;grid-template-columns:1fr;gap:12px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.btn.primary{grid-column:1/-1;grid-row:1;min-width:0}.metrics{grid-template-columns:1fr 1fr}.result{min-height:138px}.footnote{text-align:left}
    }
    @media (max-width:380px){.brand{gap:10px}h1{font-size:24px}.panel{padding:13px}.actions{gap:7px}.metrics{grid-template-columns:1fr}.input-foot{align-items:flex-start;flex-direction:column;gap:3px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8.7 3.8 6.9 20.2M17.1 3.8l-1.8 16.4M4 9.2h16M3.2 14.8h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <div><h1>SHA生成器</h1><p class="subtitle">文本与文件的快速本地哈希工具</p></div>
      </div>
      <div class="privacy">数据不上传</div>
    </header>

    <section class="layout">
      <section class="card panel" aria-label="SHA 输入">
        <div class="controls">
          <div>
            <label class="caption" for="algorithm">算法</label>
            <select id="algorithm">
              <optgroup label="SHA-1"><option value="SHA-1">SHA-1（兼容用途）</option></optgroup>
              <optgroup label="SHA-2">
                <option value="SHA-224">SHA-224</option><option value="SHA-256" selected>SHA-256（推荐）</option><option value="SHA-384">SHA-384</option><option value="SHA-512">SHA-512</option><option value="SHA-512/224">SHA-512/224</option><option value="SHA-512/256">SHA-512/256</option>
              </optgroup>
              <optgroup label="SHA-3"><option value="SHA3-224">SHA3-224</option><option value="SHA3-256">SHA3-256</option><option value="SHA3-384">SHA3-384</option><option value="SHA3-512">SHA3-512</option></optgroup>
              <optgroup label="SHAKE"><option value="SHAKE128">SHAKE128</option><option value="SHAKE256">SHAKE256</option></optgroup>
            </select>
          </div>
          <div id="shakeBox" hidden>
            <label class="caption" for="shakeBits">输出位数</label>
            <input id="shakeBits" type="number" min="8" max="65536" step="8" value="256" inputmode="numeric" />
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="输入类型">
          <button class="tab active" id="textTab" type="button" role="tab" aria-selected="true">文本</button>
          <button class="tab" id="fileTab" type="button" role="tab" aria-selected="false">文件</button>
        </div>

        <div id="textPanel">
          <textarea id="textInput" class="input" spellcheck="false" placeholder="输入或粘贴文本…"></textarea>
          <div class="input-foot"><span>UTF-8</span><span id="charCount">0 字符</span></div>
        </div>

        <div id="filePanel" hidden>
          <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖入文件">
            <div class="drop-inner">
              <div class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <strong>拖拽文件到这里</strong><p>大文件自动分块处理，避免一次性占用大量内存。</p>
              <button class="choose" id="chooseBtn" type="button">选择文件</button><input id="fileInput" type="file" hidden />
              <div id="fileInfo" class="file-info"><div id="fileName" class="file-name"></div><div id="fileSize" class="file-size"></div></div>
            </div>
          </div>
        </div>

        <div class="actionbar">
          <label class="case-toggle"><input id="uppercase" type="checkbox" /> 大写结果</label>
          <div class="actions"><button class="btn" id="clearBtn" type="button">清空</button><button class="btn danger" id="cancelBtn" type="button" hidden>取消</button><button class="btn primary" id="hashBtn" type="button">生成 SHA</button></div>
        </div>

        <div id="progressWrap" class="progress-wrap"><div class="progress-head"><span id="progressText">处理中…</span><span id="progressPct">0%</span></div><div class="progress"><i id="progressBar"></i></div></div>
        <div id="status" class="status" aria-live="polite">已就绪。所有计算均在浏览器本地完成。</div>
      </section>

      <aside class="card panel result-card" aria-label="SHA 结果">
        <div class="result-head"><h2>哈希结果</h2><button class="copy" id="copyBtn" type="button" disabled>复制</button></div>
        <textarea id="result" class="result" readonly spellcheck="false" placeholder="结果会显示在这里"></textarea>
        <div class="metrics">
          <div class="metric"><b>算法</b><span id="statAlgo">—</span></div><div class="metric"><b>输入大小</b><span id="statSize">—</span></div><div class="metric"><b>耗时</b><span id="statTime">—</span></div><div class="metric"><b>速度</b><span id="statSpeed">—</span></div>
        </div>
        <div id="algoNotice" class="hint"></div>
      </aside>
    </section>
    <p class="footnote">SHA 是单向哈希摘要，不是可逆加密。SHA-0 已撤回，因此不提供。</p>
  </main>

  <script id="worker-source" type="text/plain">
'use strict';

const MASK64 = (1n << 64n) - 1n;

function rotr32(x, n) { return (x >>> n) | (x << (32 - n)); }
function rotl32(x, n) { return (x << n) | (x >>> (32 - n)); }
function rotr64(x, n) {
  const b = BigInt(n);
  return ((x >> b) | (x << (64n - b))) & MASK64;
}
function rotl64(x, n) {
  if (n === 0) return x & MASK64;
  const b = BigInt(n);
  return ((x << b) | (x >> (64n - b))) & MASK64;
}
const HEX_TABLE = Array.from({length:256}, (_,i) => i.toString(16).padStart(2,'0'));
function hexOf(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i++) out += HEX_TABLE[bytes[i]];
  return out;
}
function words32ToBytes(words, countBytes) {
  const out = new Uint8Array(countBytes);
  for (let i = 0; i < countBytes; i++) {
    const w = words[i >>> 2] >>> 0;
    out[i] = (w >>> (24 - ((i & 3) << 3))) & 0xff;
  }
  return out;
}
function words64ToBytes(words, countBytes) {
  const out = new Uint8Array(countBytes);
  for (let i = 0; i < countBytes; i++) {
    const w = words[Math.floor(i / 8)];
    out[i] = Number((w >> BigInt(56 - ((i & 7) * 8))) & 0xffn);
  }
  return out;
}

class BlockHash {
  constructor(blockSize, lengthSize) {
    this.blockSize = blockSize;
    this.lengthSize = lengthSize;
    this.buffer = new Uint8Array(blockSize);
    this.bufferLength = 0;
    this.bytesHashed = 0n;
    this.finished = false;
  }
  update(data) {
    if (this.finished) throw new Error('Hasher already finalized');
    if (!(data instanceof Uint8Array)) data = new Uint8Array(data);
    let pos = 0;
    this.bytesHashed += BigInt(data.length);
    if (this.bufferLength) {
      const take = Math.min(this.blockSize - this.bufferLength, data.length);
      this.buffer.set(data.subarray(0, take), this.bufferLength);
      this.bufferLength += take;
      pos += take;
      if (this.bufferLength === this.blockSize) {
        this._processBlock(this.buffer, 0);
        this.bufferLength = 0;
      }
    }
    while (pos + this.blockSize <= data.length) {
      this._processBlock(data, pos);
      pos += this.blockSize;
    }
    if (pos < data.length) {
      this.buffer.set(data.subarray(pos), 0);
      this.bufferLength = data.length - pos;
    }
    return this;
  }
  _padAndProcess() {
    const bitLen = this.bytesHashed * 8n;
    this.buffer[this.bufferLength++] = 0x80;
    if (this.bufferLength > this.blockSize - this.lengthSize) {
      this.buffer.fill(0, this.bufferLength);
      this._processBlock(this.buffer, 0);
      this.bufferLength = 0;
    }
    this.buffer.fill(0, this.bufferLength, this.blockSize - this.lengthSize);
    let v = bitLen;
    for (let i = 0; i < this.lengthSize; i++) {
      this.buffer[this.blockSize - 1 - i] = Number(v & 0xffn);
      v >>= 8n;
    }
    this._processBlock(this.buffer, 0);
    this.bufferLength = 0;
  }
}

class SHA1 extends BlockHash {
  constructor() {
    super(64, 8);
    this.h = new Uint32Array([0x67452301,0xefcdab89,0x98badcfe,0x10325476,0xc3d2e1f0]);
    this.w = new Uint32Array(80);
  }
  _processBlock(data, offset) {
    const w = this.w;
    for (let i = 0; i < 16; i++) {
      const j = offset + i * 4;
      w[i] = (((data[j] << 24) | (data[j+1] << 16) | (data[j+2] << 8) | data[j+3]) >>> 0);
    }
    for (let i = 16; i < 80; i++) w[i] = rotl32((w[i-3]^w[i-8]^w[i-14]^w[i-16]) >>> 0, 1) >>> 0;
    let a=this.h[0], b=this.h[1], c=this.h[2], d=this.h[3], e=this.h[4];
    for (let i=0;i<80;i++) {
      let f,k;
      if (i<20) { f=(b & c) | ((~b) & d); k=0x5a827999; }
      else if (i<40) { f=b^c^d; k=0x6ed9eba1; }
      else if (i<60) { f=(b&c)|(b&d)|(c&d); k=0x8f1bbcdc; }
      else { f=b^c^d; k=0xca62c1d6; }
      const t = (rotl32(a,5) + (f>>>0) + e + k + w[i]) >>> 0;
      e=d; d=c; c=rotl32(b,30)>>>0; b=a; a=t;
    }
    this.h[0]=(this.h[0]+a)>>>0; this.h[1]=(this.h[1]+b)>>>0; this.h[2]=(this.h[2]+c)>>>0; this.h[3]=(this.h[3]+d)>>>0; this.h[4]=(this.h[4]+e)>>>0;
  }
  digestBytes() { if (!this.finished) { this._padAndProcess(); this.finished=true; } return words32ToBytes(this.h,20); }
  digestHex() { return hexOf(this.digestBytes()); }
}

const K256 = new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

const IV256 = {
  'SHA-224': [0xc1059ed8,0x367cd507,0x3070dd17,0xf70e5939,0xffc00b31,0x68581511,0x64f98fa7,0xbefa4fa4],
  'SHA-256': [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]
};
class SHA256Base extends BlockHash {
  constructor(variant='SHA-256') {
    super(64,8);
    this.variant=variant;
    this.h=new Uint32Array(IV256[variant]);
    this.w=new Uint32Array(64);
  }
  _processBlock(data, offset) {
    const w=this.w;
    for (let i=0;i<16;i++) { const j=offset+i*4; w[i]=(((data[j]<<24)|(data[j+1]<<16)|(data[j+2]<<8)|data[j+3])>>>0); }
    for (let i=16;i<64;i++) {
      const x=w[i-15], y=w[i-2];
      const s0=(rotr32(x,7)^rotr32(x,18)^(x>>>3))>>>0;
      const s1=(rotr32(y,17)^rotr32(y,19)^(y>>>10))>>>0;
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }

      if(m.type==='progress'){
        const pct=Math.max(0,Math.min(100,m.percent||0));els.progressBar.style.width=`${pct}%`;els.progressPct.textContent=`${pct.toFixed(pct<10?1:0)}%`;
        els.progressText.textContent=m.total?(mode==='file'?`${formatBytes(m.processed)} / ${formatBytes(m.total)}`:`${m.processed.toLocaleString()} / ${m.total.toLocaleString()} 字符`):'正在处理空输入';
      }else if(m.type==='result'){
        rawResult=m.hex;renderResult();els.copyBtn.disabled=false;els.progressBar.style.width='100%';els.progressPct.textContent='100%';
        els.statSize.textContent=formatBytes(m.inputBytes);els.statTime.textContent=formatTime(m.elapsedMs);
        const secs=m.elapsedMs/1000,speed=secs>0?m.inputBytes/secs:0;els.statSpeed.textContent=speed?`${formatBytes(speed)}/s`:'—';
        setStatus('计算完成。','ok');setRunning(false);activeJob=null;
      }else if(m.type==='cancelled'){
        setStatus('已取消。','warn');setRunning(false);activeJob=null;els.cancelBtn.disabled=false;resetProgress();
      }else if(m.type==='error'){
        setStatus(`计算失败：${m.message}`,'err');setRunning(false);activeJob=null;els.cancelBtn.disabled=false;
      }
    };
    worker.onerror=e=>{setStatus(`计算失败：${e.message||'Worker 错误'}`,'err');setRunning(false);activeJob=null;};

    els.copyBtn.addEventListener('click',async()=>{
      if(!els.result.value)return;
      try{await navigator.clipboard.writeText(els.result.value);setStatus('已复制。','ok');}
      catch{els.result.focus();els.result.select();const ok=document.execCommand('copy');setStatus(ok?'已复制。':'复制失败，请手动复制。',ok?'ok':'err');}
    });

    updateAlgoUI();
  })();

  </script>
</body>
</html>
